spring.application.name=PowerGym

# Activa el perfil 'local' automaticamente: si existe application-local.properties
# (ver application-local.properties.example) sus valores pisan los de aqui abajo.
spring.profiles.active=local

server.port=8081

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/powergym_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ejecuta schema.sql y data.sql en cada arranque (JdbcTemplate trabaja directamente
# sobre las tablas que crean estos scripts). UTF-8 para que 'mañana' y las tildes entren bien.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
