<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Listado de clientes</title>
</head>
<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Listado de clientes</h1>
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-end align-items-center gap-2 mb-2" th:if="${not #lists.isEmpty(clientes)}">
        <label for="tamano-pagina" class="form-label mb-0 text-nowrap">Clientes por pagina</label>
        <select id="tamano-pagina" class="form-select form-select-sm selector-tamano-pagina">
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
        </select>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Entrenador</th>
                <th>Membresia</th>
                <th>Fecha de alta</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpo-tabla-clientes">
            <tr th:each="cliente : ${clientes}" data-cliente>
                <td th:text="${cliente.nombre}"></td>
                <td th:text="${cliente.apellidos}"></td>
                <td th:text="${cliente.dni}"></td>
                <td th:text="${cliente.entrenador.valorBd}"></td>
                <td th:text="${cliente.tipoMembresia.valorBd}"></td>
                <td th:text="${#temporals.format(cliente.fechaAlta, 'dd/MM/yyyy')}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                    <form class="d-inline" method="post"
                          th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                          onsubmit="return confirm('¿Seguro que deseas eliminar este cliente?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="7" class="text-center text-muted">No hay clientes registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2" th:if="${not #lists.isEmpty(clientes)}">
        <small id="info-paginacion" class="text-muted"></small>
        <nav aria-label="Paginacion de clientes">
            <ul id="paginacion-clientes" class="pagination pagination-sm mb-0"></ul>
        </nav>
    </div>

    <script th:src="@{/js/clientes-paginacion.js}"></script>

</main>
</body>
</html>
